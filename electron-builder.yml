appId: com.ariadne.app
productName: Ariadne
directories:
  output: release
files:
  # ── built outputs ──
  - dist/**/*
  - electron/main/dist/**/*
  - electron/preload/dist/**/*
  - backend/dist/**/*
  - src-sidecar/dist/**/*
  - src-sidecar/node_modules/**/*

  # ── root node_modules: only native/external modules needed at runtime.
  #   All JS deps (react, recharts, etc.) are already bundled by Vite/esbuild.
  #   better-sqlite3 is --external in esbuild and needs its native .node addon. ──
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

  # ── exclude dev artifacts ──
  - "!**/*.map"
  - "!**/tsconfig*.json"

# ── unpack native .node bindings so they load outside the asar ──
asarUnpack:
  - "**/*.node"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
